<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Waitlist Hoop4Cause</title>
</head>
<body>

  <h1>Rejoins la waitlist 🔥</h1>

  <form id="form">
    <input type="email" id="email" placeholder="Ton email" required>

    <!-- Honeypot invisible -->
    <input type="text" id="website" style="display:none">

    <button type="submit">S'inscrire</button>
  </form>

  <p id="msg"></p>

  <script>
    const form = document.getElementById("form");
    const msg = document.getElementById("msg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value;
      const website = document.getElementById("website").value;

      // cooldown anti spam
      const lastSubmit = localStorage.getItem("lastSubmit");
      const now = Date.now();

      if (lastSubmit && now - lastSubmit < 10000) {
        msg.textContent = "⏳ Attends...";
        return;
      }

      localStorage.setItem("lastSubmit", now);

      const res = await fetch("http://localhost:3000/api/waitlist", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ email, website })
      });

      const data = await res.json();

      if (!data.success) {
        msg.textContent = "❌ " + data.message;
      } else {
        msg.textContent = data.message;
        form.reset();
      }
    });
  </script>

</body>
</html>
