<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waitlist — Hoop4Cause</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/form.css">
</head>
<body>
  <div class="card">
    <div class="pill-badge">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      Ouverture le 20 avril 2026
    </div>

    <h1>Reste <em>au courant</em></h1>
    <p class="sub">Les inscriptions ouvrent le 20 avril.<br>Laisse ton email, on te prévient en premier.</p>

    <div class="input-row">
      <input type="email" id="email" placeholder="ton@email.com" required autocomplete="email">
      <input type="text" id="website" style="display:none" tabindex="-1" aria-hidden="true">
      <button class="btn-submit" id="submit-btn">Me notifier</button>
    </div>

    <p id="msg"></p>

    <p class="note">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <rect x="3" y="11" width="18" height="11" rx="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      Aucun spam — juste une notif quand les inscriptions ouvrent.
    </p>
  </div>

  <script src="./js/form.js"></script>
</body>
</html>
